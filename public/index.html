<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十三水 - 异步场</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- 登录注册略 (保持之前版本) -->

        <!-- 游戏大厅 -->
        <div id="game-hall" style="display:none;">
            <div class="top-nav">
                <button onclick="logout()">退出</button>
                <div class="coin-display">💰 <span id="user-coins">0</span></div>
                <button onclick="togglePointsManage()">管理</button>
            </div>
            
            <div class="lobby-content">
                <div class="game-card" onclick="joinSession('8pm')">
                    <h3>预约：今晚 20:00 场</h3>
                    <div class="player-count">当前排队: <span id="count-8pm">0/4</span></div>
                </div>
                <div class="game-card" onclick="joinSession('12pm')">
                    <h3>预约：明日 12:00 场</h3>
                    <div class="player-count">当前排队: <span id="count-12pm">0/4</span></div>
                </div>
            </div>
        </div>

        <!-- 理牌牌桌 -->
        <div id="game-table" style="display:none;">
            <div class="table-header" id="track-info">
                <!-- 这里显示 ABCD 进度，完成的变绿 -->
            </div>

            <div class="cards-layout">
                <!-- 3-5-5 布局容器 -->
                <div id="cards-grid" class="cards-grid"></div>
            </div>

            <div class="table-controls">
                <div id="card-type-tips">正在分析牌型...</div>
                <button class="smart-btn" onclick="smartSort()">智能理牌</button>
                <button class="submit-btn" onclick="submitHand()">提交理牌方案</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
