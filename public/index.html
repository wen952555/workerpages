<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十三水</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- 登录区 -->
        <div id="auth-section" class="container">
            <h1>玩家登录</h1>
            <input type="tel" id="auth-phone" placeholder="手机号">
            <input type="text" id="auth-nick" placeholder="昵称" style="display:none;">
            <input type="password" id="auth-pass" maxlength="6" placeholder="密码">
            <button onclick="handleAuth()">进入游戏</button>
            <p><a href="#" onclick="toggleAuthMode(true)">立即注册账号</a></p>
        </div>

        <!-- 大厅 -->
        <div id="game-hall" style="display:none;">
            <div class="top-nav">
                <button onclick="logout()">退出</button>
                <div><b id="user-name"></b> 💰<span id="user-coins">0</span></div>
                <button onclick="togglePointsManage()">积分</button>
            </div>
            <div class="lobby-content">
                <div class="game-card" onclick="joinSession('8pm')">
                    <h3>今晚 20:00 场</h3>
                    <p>等待: <span id="count-8pm">0/4</span></p>
                </div>
                <div class="game-card" onclick="joinSession('12pm')">
                    <h3>明日 12:00 场</h3>
                    <p>等待: <span id="count-12pm">0/4</span></p>
                </div>
            </div>
        </div>

        <!-- 牌桌 -->
        <div id="game-table" style="display:none;">
            <div class="track-header" id="track-info"></div>
            <div class="table-container">
                <div class="lane-header" onclick="moveSelectedToLane(0)">头道 (点击移入)</div>
                <div id="grid-head" class="cards-grid"></div>
                <div class="lane-header" onclick="moveSelectedToLane(3)">中道 (点击移入)</div>
                <div id="grid-mid" class="cards-grid"></div>
                <div class="lane-header" onclick="moveSelectedToLane(8)">尾道 (点击移入)</div>
                <div id="grid-tail" class="cards-grid"></div>
            </div>
            <div class="controls">
                <button onclick="smartSort()" style="background:#eee;color:#333;width:40%">智能理牌</button>
                <button onclick="submitHand()" style="width:50%">确认提交</button>
            </div>
        </div>
    </div>

    <!-- 顺序加载 -->
    <script src="js/auth.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/game.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
