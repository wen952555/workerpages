<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十三水</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- 登录/注册 -->
        <div id="auth-section" class="container">
            <h1 id="auth-title">玩家登录</h1>
            <input type="tel" id="auth-phone" placeholder="手机号">
            <input type="text" id="auth-nick" placeholder="昵称 (仅注册)" style="display:none;">
            <input type="password" id="auth-pass" maxlength="6" placeholder="6位数字密码">
            <button id="primary-btn" onclick="handleAuth()">立即登录</button>
            <p id="toggle-text">没有账号？ <a href="javascript:void(0)" onclick="toggleAuthMode(true)">立即注册</a></p>
        </div>

        <!-- 大厅 -->
        <div id="game-hall" style="display:none;">
            <div class="top-nav">
                <button class="nav-btn logout" onclick="logout()">退出</button>
                <div class="user-info">
                    <span id="user-name"></span>
                    <div class="coin-display">💰 <span id="user-coins">0</span></div>
                </div>
                <button class="nav-btn manage" onclick="togglePointsManage()">积分管理</button>
            </div>

            <div class="lobby-content">
                <div class="game-card">
                    <div>
                        <h3>预约：今晚 20:00 场</h3>
                        <p>定时开赛 · 自动结算</p>
                    </div>
                    <button class="join-btn" onclick="reserveGame('今晚8点场')">预约</button>
                </div>

                <div class="game-card">
                    <div>
                        <h3>预约：明日 12:00 场</h3>
                        <p>定时开赛 · 自动结算</p>
                    </div>
                    <button class="join-btn" onclick="reserveGame('明日12点场')">预约</button>
                </div>
            </div>

            <!-- 积分管理 -->
            <div id="points-modal" class="modal">
                <div class="modal-content">
                    <h3>积分管理</h3>
                    <input type="tel" id="search-phone" placeholder="输入接收人手机号">
                    <button onclick="searchPlayer()">查询玩家</button>
                    <div id="search-result"></div>
                    <div id="transfer-box" style="display:none;">
                        <input type="number" id="send-amount" placeholder="赠送数量">
                        <button onclick="sendCoins()" style="margin-top:10px">确认赠送</button>
                    </div>
                    <button onclick="togglePointsManage()" style="background:#eee;color:#333;margin-top:15px">取消关闭</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
