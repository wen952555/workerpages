
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十三水 - 积分系统</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <!-- 登录/注册区 -->
        <div id="auth-section">
            <h3>玩家注册</h3>
            <input type="tel" id="reg-phone" placeholder="手机号">
            <input type="text" id="reg-nick" placeholder="游戏昵称">
            <input type="password" id="reg-pass" maxlength="6" placeholder="6位密码">
            <button onclick="register()">注册并进入游戏</button>
        </div>

        <!-- 游戏大厅 -->
        <div id="game-hall" style="display:none;">
            <h2>欢迎, <span id="user-name"></span></h2>
            <p>我的积分: <b id="user-coins">0</b></p>
            <hr>
            <h3>赠送积分</h3>
            <input type="tel" id="search-phone" placeholder="输入对方手机号">
            <button onclick="searchPlayer()">查找</button>
            <div id="search-result"></div>
            <div id="transfer-box" style="display:none;">
                <input type="number" id="send-amount" placeholder="赠送金额">
                <button onclick="sendCoins()">确认赠送</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
